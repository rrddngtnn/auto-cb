[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cb"
version = "0.1.0"
description = "CodeBuddy International (codebuddy.ai) Device Flow client, Keycloak direct broker, 5-step trial onboarding, and StyxRouter/OmniRoute installer."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auto-cb = "auto_cb.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
